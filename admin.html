<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RC HATS - Administrador</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 7px 0 0;
      color: #ccc;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 9px;
      font-size: 16px;
    }

    input,
    select {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #666;
    }

    .danger {
      background: #c62828;
    }

    .success {
      background: #16833b;
    }

    .hidden {
      display: none !important;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
    }

    .message.ok {
      display: block;
      background: #e6f7eb;
      color: #176b32;
    }

    .message.error {
      display: block;
      background: #fde8e8;
      color: #a71919;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .product img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h3 {
      margin-bottom: 5px;
    }

    .available {
      color: #16833b;
      font-weight: bold;
    }

    .unavailable {
      color: #c62828;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .user {
      background: #eee;
      padding: 12px;
      border-radius: 9px;
      word-break: break-word;
      margin-bottom: 15px;
    }

    .small {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    @media(max-width:600px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>RC HATS</h1>
  <p>Panel de administración</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h2>Iniciar sesión</h2>

    <p class="small">
      Escribe tu correo y te enviaremos un enlace para entrar.
      No necesitas contraseña.
    </p>

    <label>Correo electrónico</label>

    <input
      id="email"
      type="email"
      placeholder="tu-correo@gmail.com"
      autocomplete="email"
    >

    <button onclick="sendMagicLink()">
      📩 Enviarme enlace de acceso
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- PANEL ADMIN -->
  <div id="adminSection" class="hidden">

    <div class="card">

      <h2>Panel RC HATS</h2>

      <div class="user">
        <strong>Administrador:</strong><br>
        <span id="adminEmail"></span>
      </div>

      <button
        class="secondary"
        onclick="logout()"
      >
        Cerrar sesión
      </button>

    </div>


    <!-- AGREGAR GORRA -->
    <div class="card">

      <h2 id="formTitle">Agregar gorra</h2>

      <input
        type="hidden"
        id="productId"
      >

      <label>Nombre de la gorra</label>

      <input
        id="productName"
        type="text"
        placeholder="Ejemplo: Gorra RC HATS #01"
      >

      <label>Tipo</label>

      <select id="productType">
        <option value="G5">G5</option>
        <option value="Original">Original</option>
      </select>

      <label>Imagen</label>

      <input
        id="productImage"
        type="url"
        placeholder="URL de la imagen"
      >

      <label>Disponibilidad</label>

      <select id="productAvailable">
        <option value="true">Disponible</option>
        <option value="false">Agotada</option>
      </select>

      <button
        class="success"
        onclick="saveProduct()"
      >
        💾 Guardar gorra
      </button>

      <button
        id="cancelButton"
        class="secondary hidden"
        onclick="clearForm()"
      >
        Cancelar edición
      </button>

      <div id="productMessage" class="message"></div>

    </div>


    <!-- CATÁLOGO -->
    <div class="card">

      <h2>Mis gorras</h2>

      <button onclick="loadProducts()">
        🔄 Actualizar catálogo
      </button>

      <div id="products">
        Cargando...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =========================================
     CONFIGURACIÓN
     ========================================= */

  const SUPABASE_URL =
    "https://itxptdwwnpnsbzbzwkwt.supabase.co";

  /*
     PEGA AQUÍ TU PUBLISHABLE KEY.

     NO pongas tu contraseña.
     NO pongas la Secret Key.
  */

  const SUPABASE_KEY =
    "sb_publishable_w_HpfrpFyBkKdgh92drhMA_Tat8CMRp";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTOS
     ========================================= */

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");


  /* =========================================
     MENSAJES
     ========================================= */

  function message(id, text, type) {

    const element =
      document.getElementById(id);

    element.textContent = text;

    element.className =
      "message " + type;
  }


  /* =========================================
     ENLACE MÁGICO
     ========================================= */

  async function sendMagicLink() {

    const email =
      document.getElementById("email")
        .value
        .trim();


    if (!email) {

      message(
        "loginMessage",
        "Escribe tu correo electrónico.",
        "error"
      );

      return;
    }


    message(
      "loginMessage",
      "Enviando enlace...",
      "ok"
    );


    const redirectTo =
      window.location.origin +
      window.location.pathname;


    const { error } =
      await supabaseClient.auth.signInWithOtp({

        email: email,

        options: {
          emailRedirectTo: redirectTo
        }

      });


    if (error) {

      console.error(error);

      message(
        "loginMessage",
        "No se pudo enviar el enlace. Revisa la configuración de Supabase.",
        "error"
      );

      return;
    }


    message(
      "loginMessage",
      "✅ Enlace enviado. Revisa tu correo y toca el enlace para entrar.",
      "ok"
    );

  }


  /* =========================================
     MOSTRAR ADMIN
     ========================================= */

  function showAdmin(user) {

    loginSection.classList.add("hidden");

    adminSection.classList.remove("hidden");

    document.getElementById("adminEmail")
      .textContent = user.email || "";

    loadProducts();

  }


  /* =========================================
     CERRAR SESIÓN
     ========================================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    adminSection.classList.add("hidden");

    loginSection.classList.remove("hidden");

  }


  /* =========================================
     CARGAR PRODUCTOS
     ========================================= */

  async function loadProducts() {

    const container =
      document.getElementById("products");

    container.innerHTML =
      "Cargando gorras...";


    const { data, error } =
      await supabaseClient
        .from("productos")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      console.error(error);

      container.innerHTML =
        "<p>No se pudieron cargar las gorras.</p>";

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        "<p>Aún no tienes gorras registradas.</p>";

      return;
    }


    container.innerHTML = "";


    data.forEach(product => {

      const div =
        document.createElement("div");

      div.className = "product";


      const image =
        product.imagen_url
          ? `
            <img
              src="${escapeHtml(product.imagen_url)}"
              alt="${escapeHtml(product.nombre || "Gorra")}"
              onerror="this.style.display='none'"
            >
          `
          : "";


      const status =
        product.disponible
          ? `<p class="available">✓ Disponible</p>`
          : `<p class="unavailable">✕ Agotada</p>`;


      div.innerHTML = `

        ${image}

        <h3>
          ${escapeHtml(product.nombre || "Sin nombre")}
        </h3>

        <p>
          <strong>Tipo:</strong>
          ${escapeHtml(product.tipo || "")}
        </p>

        ${status}

        <div class="actions">

          <button
            onclick='editProduct(${JSON.stringify(product)})'
          >
            ✏️ Editar
          </button>

          <button
            class="danger"
            onclick="deleteProduct(${product.id})"
          >
            🗑️ Eliminar
          </button>

        </div>

      `;


      container.appendChild(div);

    });

  }


  /* =========================================
     SEGURIDAD HTML
     ========================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     GUARDAR PRODUCTO
     ========================================= */

  async function saveProduct() {

    const id =
      document.getElementById("productId").value;

    const nombre =
      document.getElementById("productName")
        .value
        .trim();

    const tipo =
      document.getElementById("productType").value;

    const imagen_url =
      document.getElementById("productImage")
        .value
        .trim();

    const disponible =
      document.getElementById("productAvailable")
        .value === "true";


    if (!nombre) {

      message(
        "productMessage",
        "Escribe el nombre de la gorra.",
        "error"
      );

      return;
    }


    message(
      "productMessage",
      "Guardando...",
      "ok"
    );


    let result;


    if (id) {

      result =
        await supabaseClient
          .from("productos")
          .update({
            nombre,
            tipo,
            imagen_url,
            disponible
          })
          .eq("id", id);

    } else {

      result =
        await supabaseClient
          .from("productos")
          .insert({
            nombre,
            tipo,
            imagen_url,
            disponible
          });

    }


    if (result.error) {

      console.error(result.error);

      message(
        "productMessage",
        "No se pudo guardar la gorra.",
        "error"
      );

      return;
    }


    message(
      "productMessage",
      "✅ Gorra guardada correctamente.",
      "ok"
    );


    clearForm();

    loadProducts();

  }


  /* =========================================
     EDITAR
     ========================================= */

  function editProduct(product) {

    document.getElementById("productId")
      .value = product.id;

    document.getElementById("productName")
      .value = product.nombre || "";

    document.getElementById("productType")
      .value = product.tipo || "G5";

    document.getElementById("productImage")
      .value = product.imagen_url || "";

    document.getElementById("productAvailable")
      .value = product.disponible
        ? "true"
        : "false";


    document.getElementById("formTitle")
      .textContent = "Editar gorra";


    document.getElementById("cancelButton")
      .classList.remove("hidden");

  }


  /* =========================================
     LIMPIAR FORMULARIO
     ========================================= */

  function clearForm() {

    document.getElementById("productId")
      .value = "";

    document.getElementById("productName")
      .value = "";

    document.getElementById("productType")
      .value = "G5";

    document.getElementById("productImage")
      .value = "";

    document.getElementById("productAvailable")
      .value = "true";

    document.getElementById("formTitle")
      .textContent = "Agregar gorra";

    document.getElementById("cancelButton")
      .classList.add("hidden");

  }


  /* =========================================
     ELIMINAR
     ========================================= */

  async function deleteProduct(id) {

    if (
      !confirm(
        "¿Seguro que quieres eliminar esta gorra?"
      )
    ) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("productos")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "No se pudo eliminar la gorra."
      );

      return;
    }


    loadProducts();

  }


  /* =========================================
     COMPROBAR SESIÓN
     ========================================= */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (
      data.session &&
      data.session.user
    ) {

      showAdmin(
        data.session.user
      );

    }

  }


  /* =========================================
     ESCUCHAR CAMBIOS DE AUTENTICACIÓN
     ========================================= */

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (
        session &&
        session.user
      ) {

        showAdmin(
          session.user
        );

      } else {

        adminSection.classList.add("hidden");

        loginSection.classList.remove("hidden");

      }

    }
  );


  /* =========================================
     INICIAR
     ========================================= */

  checkSession();

</script>

</body>
</html>
```
