<script>

  /* =========================================================
     CONFIGURACIÓN SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://itxptdwwnpnsbzbzwkwt.supabase.co";


  /*
    PEGA AQUÍ TU PUBLISHABLE KEY DE SUPABASE.

    IMPORTANTE:
    - Usa la Publishable Key.
    - No uses la Secret Key.
    - No debe tener espacios.
  */

  const SUPABASE_KEY =
    "sb_publishable_w_HpfrpFyBkKdgh92drhMA_Tat8CMRp";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const ADMIN_EMAIL =
    document.getElementById("email").value.trim();


  const BUCKET =
    "product-images";


  let editingProduct = null;


  /* =========================================================
     INICIO
     ========================================================= */

  document.addEventListener("DOMContentLoaded", async () => {

    const {
      data: {
        session
      }
    } = await supabaseClient.auth.getSession();

    if (session) {

      const email =
        session.user.email;

      if (email === ADMIN_EMAIL) {

      } else {

  });


  /* =========================================================
     AUTH
     ========================================================= */

  async function sendMagicLink() {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {

      showLoginMessage(
        "Escribe tu correo electrónico.",
        true
      );

      return;
    }


    const button =
      document.getElementById("loginButton");

    button.disabled = true;

    button.textContent =
      "Enviando...";


    try {

      const redirectTo =
        window.location.origin +
        window.location.pathname;


      const {
        error
      } =
      await supabaseClient.auth.signInWithOtp({

        email: email,

        options: {

          emailRedirectTo: redirectTo,

          shouldCreateUser: false

        }

      });


      if (error) {

        console.error(error);

        showLoginMessage(
          "No se pudo enviar el enlace.\n\n" +
          error.message,
          true
        );

      } else {

        showLoginMessage(
          "Enlace enviado correctamente.\n\n" +
          "Revisa tu correo y abre el enlace para entrar.",
          false
        );

      }

    } catch (error) {

      console.error(error);

      showLoginMessage(
        "Ocurrió un error:\n\n" +
        error.message,
        true
      );

    }


    button.disabled = false;

    button.textContent =
      "Enviarme enlace de acceso";
  }


  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        event === "SIGNED_IN" &&
        session
      ) {

        const email =
          session.user.email;

        const adminEmail =
          document.getElementById("email")
            .value
            .trim();

        if (email === adminEmail) {

          showAdmin(email);

        } else {

          await supabaseClient.auth.signOut();

          alert(
            "Esta cuenta no tiene permiso para administrar RC HATS."
          );
        }

      }


      if (event === "SIGNED_OUT") {

        document
          .getElementById("adminSection")
          .classList.add("hidden");

        document
          .getElementById("loginSection")
          .classList.remove("hidden");
      }

    }
  );


  function showAdmin(email) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    document
      .getElementById("userEmail")
      .textContent = email;

    loadProducts();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

  }


  function showLoginMessage(message, error) {

    const box =
      document.getElementById("loginMessage");

    box.textContent = message;

    box.classList.remove(
      "hidden",
      "success",
      "error"
    );

    box.classList.add(
      error ? "error" : "success"
    );

  }


  /* =========================================================
     PREVISUALIZAR FOTOS
     ========================================================= */

  function previewImages() {

    const input =
      document.getElementById("productImages");

    const preview =
      document.getElementById("preview");

    preview.innerHTML = "";


    const files =
      Array.from(input.files);


    files.forEach((file, index) => {

      const reader =
        new FileReader();


      reader.onload = function(e) {

        const item =
          document.createElement("div");

        item.className =
          "preview-item";


        item.innerHTML = `

          <img
            src="${e.target.result}"
            alt="Foto ${index + 1}"
          >

          <span class="preview-number">
            ${index + 1}
          </span>

        `;


        preview.appendChild(item);

      };


      reader.readAsDataURL(file);

    });

  }


  /* =========================================================
     SUBIR FOTOS
     ========================================================= */

  async function uploadImages(files, productId) {

    const urls = [];


    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        files[i];


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9.-]/g,
            "_"
          );


      const uniqueName =
        Date.now() +
        "_" +
        i +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 8) +
        "_" +
        safeName;


      const path =
        "productos/" +
        productId +
        "/" +
        uniqueName;


      const {
        data,
        error
      } =
      await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType:
              file.type
          }
        );


      if (error) {

        console.error(error);

        throw new Error(
          "No se pudo subir la foto " +
          (i + 1) +
          ": " +
          error.message
        );

      }


      const {
        data: publicData
      } =
      supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(path);


      if (
        !publicData ||
        !publicData.publicUrl
      ) {

        throw new Error(
          "No se pudo obtener la URL de la foto."
        );

      }


      urls.push(
        publicData.publicUrl
      );

    }


    return urls;

  }


  /* =========================================================
     GUARDAR PRODUCTO
     ========================================================= */

  async function saveProduct() {

    const name =
      document
        .getElementById("productName")
        .value
        .trim();


    const type =
      document
        .getElementById("productType")
        .value;


    const available =
      document
        .getElementById("productAvailable")
        .value === "true";


    const files =
      Array.from(
        document
          .getElementById("productImages")
          .files
      );


    const message =
      document.getElementById("formMessage");


    const button =
      document.getElementById("saveButton");


    if (!name) {

      showFormMessage(
        "Escribe el nombre del producto.",
        true
      );

      return;

    }


    if (
      !editingProduct &&
      files.length === 0
    ) {

      showFormMessage(
        "Selecciona por lo menos una foto.",
        true
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "Guardando...";


    try {

      /* =====================================================
         NUEVO PRODUCTO
         ===================================================== */

      if (!editingProduct) {

        const {
          data: product,
          error
        } =
        await supabaseClient
          .from("productos")
          .insert({

            nombre: name,

            tipo: type,

            disponible: available,

            imagen_url: "[]"

          })
          .select()
          .single();


        if (error) {

          throw error;

        }


        const imageUrls =
          await uploadImages(
            files,
            product.id
          );


        const {
          error: updateError
        } =
        await supabaseClient
          .from("productos")
          .update({

            imagen_url:
              JSON.stringify(
                imageUrls
              )

          })
          .eq(
            "id",
            product.id
          );


        if (updateError) {

          throw updateError;

        }


        showFormMessage(
          "Producto agregado correctamente.",
          false
        );

      }


      /* =====================================================
         EDITAR PRODUCTO
         ===================================================== */

      else {

        let imageUrls =
          getProductImages(
            editingProduct
              .imagen_url
          );


        /*
          Si seleccionaste nuevas fotos,
          se agregan a las existentes.
        */

        if (files.length > 0) {

          const newUrls =
            await uploadImages(
              files,
              editingProduct.id
            );


          imageUrls =
            imageUrls.concat(
              newUrls
            );

        }


        const {
          error
        } =
        await supabaseClient
          .from("productos")
          .update({

            nombre: name,

            tipo: type,

            disponible: available,

            imagen_url:
              JSON.stringify(
                imageUrls
              )

          })
          .eq(
            "id",
            editingProduct.id
          );


        if (error) {

          throw error;

        }


        showFormMessage(
          "Producto actualizado correctamente.",
          false
        );

      }


      resetForm();

      await loadProducts();


    } catch (error) {

      console.error(error);

      showFormMessage(
        "No se pudo guardar el producto.\n\n" +
        error.message,
        true
      );

    }


    button.disabled = false;

    button.textContent =
      editingProduct
        ? "Actualizar producto"
        : "Guardar producto";

  }


  /* =========================================================
     OBTENER IMÁGENES
     ========================================================= */

  function getProductImages(value) {

    if (!value) {

      return [];

    }


    try {

      const parsed =
        JSON.parse(value);


      if (
        Array.isArray(parsed)
      ) {

        return parsed;

      }

    } catch (e) {

      /*
        Compatibilidad con productos
        antiguos que tenían una sola URL.
      */

    }


    return [value];

  }


  /* =========================================================
     CARGAR PRODUCTOS
     ========================================================= */

  async function loadProducts() {

    const container =
      document.getElementById("products");


    container.innerHTML =
      "Cargando productos...";


    const {
      data,
      error
    } =
    await supabaseClient
      .from("productos")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="message error">
          No se pudieron cargar los productos.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      container.innerHTML =
        "Todavía no hay productos.";

      return;

    }


    container.innerHTML = "";


    data.forEach(product => {

      const images =
        getProductImages(
          product.imagen_url
        );


      const div =
        document.createElement("div");

      div.className =
        "product";


      let imagesHTML = "";


      images.forEach(url => {

        imagesHTML += `

          <img
            src="${escapeAttribute(url)}"
            alt="${escapeAttribute(product.nombre)}"
          >

        `;

      });


      div.innerHTML = `

        <div class="product-images">

          ${
            imagesHTML ||
            "<div>Sin fotos</div>"
          }

        </div>


        <div class="product-info">

          <h3>
            ${escapeHtml(product.nombre)}
          </h3>

          <p>
            <strong>Tipo:</strong>
            ${escapeHtml(product.tipo)}
          </p>

          <p class="${
            product.disponible
              ? "available"
              : "unavailable"
          }">

            ${
              product.disponible
                ? "Disponible"
                : "Agotado"
            }

          </p>

        </div>


        <button
          onclick="editProduct(${product.id})"
        >
          Editar
        </button>


        <button
          class="btn-red"
          onclick="deleteProduct(${product.id})"
        >
          Eliminar
        </button>

      `;


      container.appendChild(div);

    });

  }


  /* =========================================================
     EDITAR
     ========================================================= */

  async function editProduct(id) {

    const {
      data,
      error
    } =
    await supabaseClient
      .from("productos")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


    if (error) {

      alert(
        "No se pudo cargar el producto:\n" +
        error.message
      );

      return;

    }


    editingProduct =
      data;


    document
      .getElementById("productId")
      .value =
      data.id;


    document
      .getElementById("productName")
      .value =
      data.nombre;


    document
      .getElementById("productType")
      .value =
      data.tipo;


    document
      .getElementById("productAvailable")
      .value =
      data.disponible
        ? "true"
        : "false";


    document
      .getElementById("formTitle")
      .textContent =
      "Editar producto";


    document
      .getElementById("saveButton")
      .textContent =
      "Actualizar producto";


    document
      .getElementById("cancelButton")
      .classList
      .remove("hidden");


    const images =
      getProductImages(
        data.imagen_url
      );


    const preview =
      document.getElementById("preview");


    preview.innerHTML = "";


    images.forEach(
      (url, index) => {

        const item =
          document.createElement("div");

        item.className =
          "preview-item";


        item.innerHTML = `

          <img
            src="${escapeAttribute(url)}"
            alt="Foto ${index + 1}"
          >

          <span class="preview-number">
            ${index + 1}
          </span>

        `;


        preview.appendChild(item);

      }
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================================================
     ELIMINAR PRODUCTO
     ========================================================= */

  async function deleteProduct(id) {

    const confirmar =
      confirm(
        "¿Seguro que quieres eliminar este producto?"
      );


    if (!confirmar) {

      return;

    }


    try {

      const {
        data: product,
        error
      } =
      await supabaseClient
        .from("productos")
        .select("*")
        .eq(
          "id",
          id
        )
        .single();


      if (error) {

        throw error;

      }


      const images =
        getProductImages(
          product.imagen_url
        );


      /*
        Convertimos las URLs públicas
        nuevamente a rutas de Storage.
      */

      const paths =
        images
          .map(
            getStoragePath
          )
          .filter(Boolean);


      if (paths.length > 0) {

        const {
          error: storageError
        } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .remove(paths);


        if (storageError) {

          console.warn(
            "No se pudieron eliminar algunas fotos:",
            storageError
          );

        }

      }


      const {
        error: deleteError
      } =
      await supabaseClient
        .from("productos")
        .delete()
        .eq(
          "id",
          id
        );


      if (deleteError) {

        throw deleteError;

      }


      await loadProducts();

      alert(
        "Producto eliminado correctamente."
      );


    } catch (error) {

      console.error(error);

      alert(
        "No se pudo eliminar el producto:\n\n" +
        error.message
      );

    }

  }


  /* =========================================================
     OBTENER RUTA DE STORAGE
     ========================================================= */

  function getStoragePath(url) {

    if (!url) {

      return null;

    }


    const marker =
      "/storage/v1/object/public/" +
      BUCKET +
      "/";


    const index =
      url.indexOf(marker);


    if (index === -1) {

      return null;

    }


    return decodeURIComponent(
      url.substring(
        index + marker.length
      )
    );

  }


  /* =========================================================
     CANCELAR EDICIÓN

  function cancelEdit() {

    resetForm();

  function resetForm() {

    editingProduct = null;


    document
      .getElementById("productId")
      .value = "";


    document
      .getElementById("productName")
      .value = "";


    document
      .getElementById("productType")
      .value = "G5";


    document
      .getElementById("productAvailable")
      .value = "true";


    document
      .getElementById("productImages")
      .value = "";


    document
      .getElementById("preview")
      .innerHTML = "";


    document
      .getElementById("formTitle")
      .textContent =
      "Agregar producto";


    document
      .getElementById("saveButton")
      .textContent =
      "Guardar producto";


    document
      .getElementById("cancelButton")
      .classList
      .add("hidden");


    document
      .getElementById("formMessage")
      .classList
      .add("hidden");

  }


  /* =========================================================
     MENSAJES
     ========================================================= */

  function showFormMessage(
    message,
    error
  ) {

    const box =
      document.getElementById(
        "formMessage"
      );


    box.textContent =
      message;


    box.classList.remove(
      "hidden",
      "success",
      "error"
    );


    box.classList.add(
      error
        ? "error"
        : "success"
    );

  }


  /* =========================================================
     SEGURIDAD DE TEXTO HTML
     ========================================================= */

  function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

      return "";

    }


    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }
