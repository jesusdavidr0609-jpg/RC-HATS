<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RC HATS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 38px;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
      font-size: 15px;
    }

    .whatsapp-principal {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .filtros {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px 10px;
      background: white;
    }

    .filtros button {
      border: none;
      background: #111;
      color: white;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .filtros button:hover {
      background: #333;
    }

    #catalogo {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .producto {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .producto-imagen {
      width: 100%;
      height: 250px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .producto-imagen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sin-imagen {
      color: #888;
      font-size: 14px;
    }

    .producto-info {
      padding: 15px;
    }

    .producto-info h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .tipo {
      display: inline-block;
      background: #111;
      color: white;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .estado {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .disponible {
      color: #159447;
    }

    .agotado {
      color: #d62828;
    }

    .btn-whatsapp {
      display: block;
      width: 100%;
      text-align: center;
      background: #25D366;
      color: white;
      padding: 11px;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .btn-whatsapp.deshabilitado {
      background: #aaa;
      pointer-events: none;
    }

    .mensaje {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      grid-column: 1 / -1;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 30px;
      }

      .producto-imagen {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>RC HATS</h1>

    <p>DISEÑO QUE CORONA TU ESTILO</p>

    <a
      class="whatsapp-principal"
      href="https://wa.me/528118995380?text=Hola%20RC%20HATS%2C%20quiero%20ver%20las%20gorras%20disponibles."
      target="_blank">
      Pedir por WhatsApp
    </a>
  </header>


  <div class="filtros">

    <button onclick="filtrar('Todas')">
      Todas
    </button>

    <button onclick="filtrar('G5')">
      G5
    </button>

    <button onclick="filtrar('Original')">
      Original
    </button>

    <button onclick="filtrar('Disponibles')">
      Disponibles
    </button>

  </div>


  <main id="catalogo">

    <div class="mensaje">
      Cargando catálogo...
    </div>

  </main>


  <footer>
    © 2026 RC HATS
    <br>
    DISEÑO QUE CORONA TU ESTILO
  </footer>


  <!-- ========================================= -->
  <!-- SUPABASE                                  -->
  <!-- ========================================= -->

  <script>

    const SUPABASE_URL =
      "https://itxptdwwnpnsbzbzwkwt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_w_HpfrpFyBkKdgh92drhMA_Tat8CMRp";


    const numeroWhatsApp =
      "528118995380";


    let productos = [];


    async function cargarProductos() {

      const catalogo =
        document.getElementById("catalogo");

      try {

        const respuesta = await fetch(
          `${SUPABASE_URL}/rest/v1/productos?select=*`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );


        if (!respuesta.ok) {

          throw new Error(
            "No se pudieron cargar los productos"
          );

        }


        const datos =
          await respuesta.json();


        productos = datos.map(producto => ({

          ...producto,

          imagen:
            producto.imagen_url ||
            producto.imagen ||
            ""

        }));


        mostrarProductos(productos);


      } catch (error) {

        console.error(error);


        catalogo.innerHTML = `

          <div class="mensaje">

            <h3>
              No se pudo cargar el catálogo
            </h3>

            <p>
              Revisa la conexión con Supabase.
            </p>

          </div>

        `;

      }

    }


    function mostrarProductos(lista) {

      const catalogo =
        document.getElementById("catalogo");


      if (!lista || lista.length === 0) {

        catalogo.innerHTML = `

          <div class="mensaje">

            <h3>
              No hay gorras disponibles
            </h3>

            <p>
              Próximamente habrá nuevos modelos.
            </p>

          </div>

        `;

        return;

      }


      catalogo.innerHTML = "";


      lista.forEach(producto => {


        const tarjeta =
          document.createElement("div");

        tarjeta.className = "producto";


        const disponible =
          producto.disponible === true;


        const imagen =
          producto.imagen || "";


        let contenidoImagen;


        if (imagen) {

          contenidoImagen = `

            <img
              src="${imagen}"
              alt="${producto.nombre || "Gorra RC HATS"}"
              loading="lazy"
            >

          `;

        } else {

          contenidoImagen = `

            <span class="sin-imagen">
              Sin imagen
            </span>

          `;

        }


        const mensaje =
          encodeURIComponent(
            `Hola RC HATS, me interesa la gorra ${producto.nombre || ""}.`
          );


        tarjeta.innerHTML = `

          <div class="producto-imagen">

            ${contenidoImagen}

          </div>


          <div class="producto-info">

            <h3>
              ${producto.nombre || "Gorra RC HATS"}
            </h3>


            <span class="tipo">

              ${producto.tipo || "Gorra"}

            </span>


            <div
              class="estado ${
                disponible
                  ? "disponible"
                  : "agotado"
              }">

              ${
                disponible
                  ? "Disponible"
                  : "Agotado"
              }

            </div>


            <a

              class="btn-whatsapp ${
                disponible
                  ? ""
                  : "deshabilitado"
              }"

              href="${
                disponible
                  ? `https://wa.me/${numeroWhatsApp}?text=${mensaje}`
                  : "#"
              }"

              target="_blank"

            >

              ${
                disponible
                  ? "Pedir por WhatsApp"
                  : "Agotado"
              }

            </a>

          </div>

        `;


        catalogo.appendChild(tarjeta);

      });

    }


    function filtrar(filtro) {


      if (filtro === "Todas") {

        mostrarProductos(productos);

        return;

      }


      if (filtro === "Disponibles") {

        const filtrados =
          productos.filter(
            producto =>
              producto.disponible === true
          );

        mostrarProductos(filtrados);

        return;

      }


      const filtrados =
        productos.filter(
          producto =>
            producto.tipo === filtro
        );


      mostrarProductos(filtrados);

    }


    cargarProductos();

  </script>

</body>
</html>
