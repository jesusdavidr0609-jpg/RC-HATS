  <style>

<body>

<header>
  <h1>RC HATS</h1>
  <p>DISEÑO QUE CORONA TU ESTILO</p>
</header>


<section class="hero">

  <h2>Catálogo</h2>

  <p>
    Descubre nuestra colección de gorras G5 y Original.
  </p>

</section>


<div class="filters">

  <button
    class="active"
    onclick="setFilter('Todas', this)"
  >
    Todas
  </button>

  <button
    onclick="setFilter('G5', this)"
  >
    G5
  </button>

  <button
    onclick="setFilter('Original', this)"
  >
    Original
  </button>

  <button
    onclick="setFilter('Disponibles', this)"
  >
    Disponibles
  </button>

</div>


<div id="message" class="message">
  Cargando catálogo...
</div>


<section
  id="catalog"
  class="catalog"
></section>


<footer>

  <p>
    RC HATS
  </p>

  <p>
    DISEÑO QUE CORONA TU ESTILO
  </p>

</footer>


<script>

  /* =====================================================
     SUPABASE
     ===================================================== */

  const SUPABASE_URL =
    "https://itxptdwwnpnsbzbzwkwt.supabase.co";


  /*
    PEGA AQUÍ TU PUBLISHABLE KEY.

    IMPORTANTE:
    - Debe ser la misma Publishable Key
      que utilizas en admin.html.
    - No debe tener espacios.
    - NO uses la Secret Key.
  */

  const SUPABASE_KEY =
    "sb_publishable_w_HpfrpFyBkKdgh92drhMA_Tat8CMRp";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let allProducts = [];

  let currentFilter = "Todas";


  /* =====================================================
     INICIAR
     ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    loadProducts
  );


  /* =====================================================
     CARGAR PRODUCTOS
     ===================================================== */

  async function loadProducts() {

    const message =
      document.getElementById("message");

    const catalog =
      document.getElementById("catalog");


    message.className =
      "message";

    message.textContent =
      "Cargando catálogo...";


    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("productos")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        throw error;

      }


      allProducts =
        data || [];


      message.style.display =
        "none";


      renderProducts();


    } catch (error) {

      console.error(error);

      catalog.innerHTML = "";


      message.className =
        "message error";


      message.style.display =
        "block";


      message.innerHTML =
        `
          <strong>
            No se pudo cargar el catálogo.
          </strong>

          <br><br>

          Revisa la conexión con Supabase.

          <br><br>

          <small>
            ${escapeHtml(error.message)}
          </small>
        `;

    }

  }


  /* =====================================================
     FILTROS
     ===================================================== */

  function setFilter(
    filter,
    button
  ) {

    currentFilter =
      filter;


    document
      .querySelectorAll(
        ".filters button"
      )
      .forEach(btn => {

        btn.classList.remove(
          "active"
        );

      });


    button.classList.add(
      "active"
    );


    renderProducts();

  }


  /* =====================================================
     MOSTRAR PRODUCTOS
     ===================================================== */

  function renderProducts() {

    const catalog =
      document.getElementById(
        "catalog"
      );


    catalog.innerHTML = "";


    let products =
      [...allProducts];


    if (
      currentFilter === "G5"
    ) {

      products =
        products.filter(
          product =>
            product.tipo === "G5"
        );

    }


    if (
      currentFilter === "Original"
    ) {

      products =
        products.filter(
          product =>
            product.tipo === "Original"
        );

    }


    if (
      currentFilter === "Disponibles"
    ) {

      products =
        products.filter(
          product =>
            product.disponible === true
        );

    }


    if (
      products.length === 0
    ) {

      catalog.innerHTML = `

        <div
          class="message"
          style="grid-column:1/-1;"
        >
          No hay productos en esta categoría.
        </div>

      `;

      return;

    }


    products.forEach(
      product => {

        catalog.appendChild(
          createProductCard(
            product
          )
        );

      }
    );

  }


  /* =====================================================
     CREAR TARJETA
     ===================================================== */

  function createProductCard(
    product
  ) {

    const card =
      document.createElement(
        "article"
      );


    card.className =
      "product";


    const images =
      getProductImages(
        product.imagen_url
      );


    const gallery =
      document.createElement(
        "div"
      );

    gallery.className =
      "gallery";


    const mainContainer =
      document.createElement(
        "div"
      );

    mainContainer.className =
      "main-image-container";


    const mainImage =
      document.createElement(
        "img"
      );

    mainImage.className =
      "main-image";


    mainImage.alt =
      product.nombre || "Gorra";


    mainContainer.appendChild(
      mainImage
    );


    const counter =
      document.createElement(
        "div"
      );

    counter.className =
      "counter";


    if (
      images.length > 0
    ) {

      counter.textContent =
        "1 / " +
        images.length;

    }


    mainContainer.appendChild(
      counter
    );


    const thumbnails =
      document.createElement(
        "div"
      );

    thumbnails.className =
      "thumbnails";


    let currentIndex = 0;


    function showImage(
      index
    ) {

      if (
        images.length === 0
      ) {

        mainImage.style.display =
          "none";

        counter.style.display =
          "none";

        return;

      }


      if (
        index < 0
      ) {

        index =
          images.length - 1;

      }


      if (
        index >= images.length
      ) {

        index = 0;

      }


      currentIndex =
        index;


      mainImage.src =
        images[currentIndex];


      counter.textContent =
        (
          currentIndex + 1
        ) +
        " / " +
        images.length;


      thumbnails
        .querySelectorAll(
          ".thumbnail"
        )
        .forEach(
          (thumb, i) => {

            thumb.classList.toggle(
              "active",
              i === currentIndex
            );

          }
        );

    }


    images.forEach(
      (url, index) => {

        const thumb =
          document.createElement(
            "img"
          );


        thumb.className =
          "thumbnail";


        thumb.src =
          url;


        thumb.alt =
          "Foto " +
          (index + 1);


        thumb.loading =
          "lazy";


        thumb.addEventListener(
          "click",
          () => {

            showImage(index);

          }
        );


        thumbnails.appendChild(
          thumb
        );

      }
    );


    if (
      images.length > 1
    ) {

      const left =
        document.createElement(
          "button"
        );

      left.className =
        "arrow arrow-left";

      left.innerHTML =
        "‹";

      left.setAttribute(
        "aria-label",
        "Foto anterior"
      );


      left.addEventListener(
        "click",
        () => {

          showImage(
            currentIndex - 1
          );

        }
      );


      const right =
        document.createElement(
          "button"
        );

      right.className =
        "arrow arrow-right";

      right.innerHTML =
        "›";

      right.setAttribute(
        "aria-label",
        "Siguiente foto"
      );


      right.addEventListener(
        "click",
        () => {

          showImage(
            currentIndex + 1
          );

        }
      );


      mainContainer.appendChild(
        left
      );

      mainContainer.appendChild(
        right
      );

    }


    gallery.appendChild(
      mainContainer
    );


    if (
      images.length > 1
    ) {

      gallery.appendChild(
        thumbnails
      );

    }


    /* =================================================
       DESLIZAR CON EL DEDO
       ================================================= */

    let startX = 0;

    let endX = 0;


    mainContainer.addEventListener(
      "touchstart",
      event => {

        startX =
          event.changedTouches[0]
            .screenX;

      },
      {
        passive: true
      }
    );


    mainContainer.addEventListener(
      "touchend",
      event => {

        endX =
          event.changedTouches[0]
            .screenX;


        const difference =
          endX - startX;


        if (
          Math.abs(difference) > 50
        ) {

          if (
            difference < 0
          ) {

            showImage(
              currentIndex + 1
            );

          } else {

            showImage(
              currentIndex - 1
            );

          }

        }

      },
      {
        passive: true
      }
    );


    if (
      images.length > 0
    ) {

      showImage(0);

    }


    /* =================================================
       INFORMACIÓN
       ================================================= */

    const info =
      document.createElement(
        "div"
      );

    info.className =
      "product-info";


    const title =
      document.createElement(
        "h3"
      );

    title.textContent =
      product.nombre || "Sin nombre";


    const type =
      document.createElement(
        "span"
      );

    type.className =
      "type";


    type.textContent =
      product.tipo || "";


    const status =
      document.createElement(
        "p"
      );


    if (
      product.disponible
    ) {

      status.className =
        "available";

      status.textContent =
        "✓ Disponible";

    } else {

      status.className =
        "unavailable";

      status.textContent =
        "Agotado";

    }


    const whatsapp =
      document.createElement(
        "a"
      );


    whatsapp.className =
      "whatsapp";


    whatsapp.target =
      "_blank";


    whatsapp.rel =
      "noopener";


    if (
      product.disponible
    ) {

      const text =
        "Hola RC HATS, me interesa la gorra: " +
        product.nombre;


      whatsapp.href =
        "https://wa.me/528118995380?text=" +
        encodeURIComponent(
          text
        );


      whatsapp.textContent =
        "Pedir por WhatsApp";

    } else {

      whatsapp.classList.add(
        "disabled"
      );


      whatsapp.textContent =
        "Agotado";

    }


    info.appendChild(
      title
    );

    info.appendChild(
      type
    );

    info.appendChild(
      status
    );

    info.appendChild(
      whatsapp
    );


    card.appendChild(
      gallery
    );

    card.appendChild(
      info
    );


    return card;

  }


  /* =====================================================
     OBTENER IMÁGENES
     ===================================================== */

  function getProductImages(
    value
  ) {

    if (!value) {

      return [];

    }


    try {

      const parsed =
        JSON.parse(value);


      if (
        Array.isArray(parsed)
      ) {

        return parsed.filter(
          url =>
            typeof url === "string" &&
            url.trim() !== ""
        );

      }

    } catch (error) {

      /*
        Compatibilidad con productos
        anteriores que tenían una sola URL.
      */

    }


    if (
      typeof value === "string" &&
      value.trim() !== ""
    ) {

      return [value];

    }


    return [];

  }


  /* =====================================================
     SEGURIDAD
     ===================================================== */

  function escapeHtml(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>

</body>
</html>
